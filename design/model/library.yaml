# Graded Takes - Source Library ("The Library")
#
# A curated directory of real, verified fantasy-football sources that a user can
# add to THEIR model on the Sources page. This is a directory of links and
# metadata, NOT a content-scraping list: every entry is link-only by default
# (name, link, their line in the accuracy ledger). Quotes and call extraction
# require a signed creator licence (see design/plan/platform.md).
#
# Schema (one entry per source):
#   id                        kebab slug (stable; the two the owner already runs keep
#                             their ids: sharp-or-square, the-favorites; so do the
#                             built-ins: engine, espn-proj, sleeper-proj, chen-tiers,
#                             house-research)
#   name                      display name
#   category                  podcasts | youtube | newsletters | analysts | feeds | news
#   type                      podcast | youtube | newsletter | site | analyst | feed
#   handle_or_url             the machine handle: podcast = RSS feed URL; youtube =
#                             channel URL; newsletter = archive/feed URL; analyst =
#                             author page; feed = API/base URL. All fetched 2026-09-10.
#   what_for                  one line: start/sit, waivers, injuries, betting lens...
#   cadence                   daily | weekdays | weekly | in-season | ...
#   free_or_paid              free | freemium | paid
#   feed_readable             true if a public machine feed exists that yields TITLES
#                             and LINKS without scraping (RSS/API). YouTube: see
#                             youtube_feed_status in meta.
#   consent_status            link-only (default for everyone) | licensed | n/a
#   suggested_default_weight  0-100, relative, same scale as data/sources.yaml
#                             (engine = 17 there). 0 = informational, never votes.
#   weight_reason             one line
#   verified_on               ISO date the URL was fetched and metadata checked
#   source_of_truth           the URL the facts were verified against
#   flags                     optional: [moved, dormant, defunct, unverified, hosts-changed,
#                             licence-blocked, needs-deal, owner-uses]
#   Optional extras: hosts, network, youtube_channel, youtube_channel_id, subscribers,
#                    last_episode, licensing, notes, x_handle
#
# Verification method (2026-09-10):
#   podcasts   - iTunes lookup/search API (returns canonical feedUrl + last releaseDate),
#                then the RSS itself was fetched and parsed (item count, latest pubDate).
#   youtube    - channel page fetched; channel id from the page's own externalId and
#                RSS <link>; subscriber count from YouTube's channel-search renderer.
#   newsletters/sites - /feed fetched and parsed where one exists; archive page fetched.
#   analysts   - author page or X profile fetched (HTTP 200); current employer from
#                2026 press coverage (cited in source_of_truth).
#   feeds      - docs/API fetched; licence text quoted in `licensing`.

meta:
  version: 1
  built_on: "2026-09-10"
  entry_count: 78
  weight_scale: "0-100 relative, normalised at consensus time; data/sources.yaml uses the same scale (engine=17)."
  youtube_feed_status: >-
    YouTube's public RSS endpoint (https://www.youtube.com/feeds/videos.xml?channel_id=UC...)
    returned HTTP 404 for every channel tested on 2026-09-10 (NFL, Fantasy Footballers, Harris
    Football), from two different networks. This is the platform-wide 2025-26 outage documented
    at https://discuss.ai.google.dev/t/youtube-rss-feed-endpoint-returns-404-errors/113379
    (Dec 2025-May 2026, no fix from Google) and
    https://thecodersblog.com/youtube-rss-feed-functionality-issues-2026/ (2026-05-06).
    Every channel page still advertises the RSS link, so it may come back intermittently, but
    it cannot be relied on. The sanctioned machine path for titles+links is the YouTube Data
    API v3: channels.list -> uploads playlist (UU...) -> playlistItems.list, 1 quota unit per
    call against a 10,000-unit/day default quota
    (https://developers.google.com/youtube/v3/getting-started). That is enough to poll ~40
    channels every 15 minutes. So youtube entries carry feed_readable: false and
    machine_path: "youtube-data-api-v3". Transcripts are NOT part of this path (data-rights plan).
  owner_already_uses: [engine, espn-proj, sleeper-proj, chen-tiers, sharp-or-square, house-research, the-favorites]

sources:

